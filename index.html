<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CupCalc</title>
    <link rel="stylesheet" href="style.css">
    <script src="./bundle.js"defer></script>
    
</head>

<body>
<div class="cabecario">
    <h1 class="titulo">CupCalc</h1>
    <p>dimensionamento do Copo</p>
</div>
    <p>digite o raio maior (R):</p>
    <input id="raioMaior" type="number">

    <p>digite o raio menor (r):</p>
    <input id="raioMenor" type="number">

    <p>digite a altura (h):</p>
    <input id="altura" type="number">

    <br><br>

    <button id="calcular">CALCULAR</button>
<div class="resultado">

    <h1>Resultado</h1>
</div>

    <p id="geratriz"></p>
    <p id="areaBaseMenor"></p>
    <p id="areaBaseMaior"></p>
    <p id="areaLateral"></p>
    <p id="areaTotal"></p>
    <p id="volume"></p>
    <p id="classificacao"></p>

    <small>By Gustavo Pezzini</small>
</body>

</html>
